name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero runtime dependencies — nothing to install.
      - name: Run test suite
        run: node --test
      - name: Run real-world smoke test (every feature, end to end)
        run: npm run smoke
      - name: Run UI audit (fails if any control claims a feature it can't back)
        run: npm run audit
